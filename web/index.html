<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Auto Sender</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Script generato automaticamente da Eel -->
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>WhatsApp Auto Sender</h1>
            <p>Pianifica l'invio dei tuoi messaggi</p>
        </div>
        
        <div class="form-group">
            <label for="contactName">Destinatario (Nome esatto in rubrica)</label>
            <input type="text" id="contactName" placeholder="Es. Mario Rossi" required>
        </div>

        <div class="form-group">
            <label for="messageText">Messaggio</label>
            <textarea id="messageText" rows="4" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
        </div>

        <div class="form-group time-group">
            <label>Quando inviare il messaggio?</label>
            <div class="datetime-inputs">
                <input type="date" id="delayDate" title="Se omesso, usa la data di oggi">
                <input type="time" id="delayTime" step="1" required title="Formato Ora:Minuti:Secondi">
            </div>
            <small class="help-text">La data è opzionale (di default è oggi).</small>
        </div>

        <button id="startBtn" class="btn-primary">Avvia Automazione</button>

        <div id="statusArea" class="status-area hidden">
            <div class="timer" id="timerDisplay">00:00</div>
            <p id="statusMessage" class="status-message">In attesa...</p>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
