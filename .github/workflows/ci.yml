name: CI Quality & Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-check:
    name: Frontend Lint & Tests (3 Levels)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint (Frontend Linting)
        run: pnpm run lint

      - name: Run Vitest Suite (Unit, Integration, E2E)
        run: pnpm run test

  backend-check:
    name: Backend Lint & Tests (3 Levels)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install ruff pytest pytest-cov

      - name: Run Ruff (Python Backend Linting)
        run: ruff check src/backend/

      - name: Run Pytest Suite (Unit, Integration, E2E)
        run: pytest tests/ -v
