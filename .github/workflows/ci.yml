name: CI Quality, Test & Automated LTS Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: read
  actions: read

jobs:
  quality-and-tests:
    name: Full Quality, Lint & Test Suite (100% Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install ruff pytest pytest-cov

      - name: Run Linters (Oxlint + Ruff)
        run: pnpm run lint

      - name: Run Full Test Suite (Vitest + Pytest)
        run: pnpm run test:all

      - name: Verify Frontend Build
        run: pnpm run build

  lts-release:
    name: Create Automated LTS Release
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and generate release tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Package Release Bundle
        run: |
          mkdir -p release-bundle
          zip -r "release-bundle/AutoSender-${{ steps.tag_version.outputs.new_tag }}-LTS.zip" . \
            -x ".git/*" ".github/*" "node_modules/*" ".pytest_cache/*" ".ruff_cache/*" "tests/coverage/*"

      - name: Create GitHub LTS Release
        uses: softprops/action-gh-release@v2
        if: steps.tag_version.outputs.new_tag
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: AutoSender ${{ steps.tag_version.outputs.new_tag }} (LTS)
          body: |
            ## 🚀 AutoSender ${{ steps.tag_version.outputs.new_tag }} LTS Release
            
            All CI quality gates, linting (Oxlint + Ruff), and full test suites passed with **100% code coverage**!
            
            ### 📝 What's Changed
            ${{ steps.tag_version.outputs.changelog }}
            
            ---
            🔒 **100% Local Storage & RPA Automation**
          files: release-bundle/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
