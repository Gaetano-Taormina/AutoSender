name: 🐛 Bug Report
description: Report an issue or bug found in AutoSender.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When scheduling a message at HH:MM, the application..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Open AutoSender UI
        2. Go to 'Compose' tab
        3. Fill in contact and time
        4. Click 'Schedule Dispatch'
        5. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The message should be queued in pending tasks and dispatched on time."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Screenshots
      description: Paste any logs from the Live Logs tab or backend terminal (remove personal info like phone numbers).
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux / Ubuntu
        - macOS
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser & ChromeDriver
      options:
        - Google Chrome (Latest)
        - Chromium
        - Microsoft Edge
        - Other
    validations:
      required: false
